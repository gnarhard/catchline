<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Capture journals, poems, lyrics, and phrases — with audio.">
  <meta name="theme-color" content="#8B1E2C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Catchline">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Catchline</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Drive sync needs the Web OAuth client ID. Replace the empty `content`
    below with the value from Google Cloud Console and ensure
    `http://localhost:5000` (and the production origin) are listed as
    Authorized JavaScript origins on that client. The same value must also
    be stored in lib/data/sync/oauth_config.dart.
  -->
  <meta name="google-signin-client_id" content="332621785030-ts1k5v02kt84fts9jjc7akdk854m0dmc.apps.googleusercontent.com">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
